<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Prakrut Kotecha</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <meta name="description" content="Photo gallery of Prakrut Kotecha — travels, conferences, and moments beyond the lab.">
    <link rel="canonical" href="https://prakrutk.github.io/gallery.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Gallery | Prakrut Kotecha">
    <meta property="og:description" content="Photo gallery of Prakrut Kotecha — travels, conferences, and moments beyond the lab.">
    <meta property="og:url" content="https://prakrutk.github.io/gallery.html">
    <meta property="og:image" content="https://prakrutk.github.io/images/profile.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gallery | Prakrut Kotecha">
    <meta name="twitter:description" content="Photo gallery of Prakrut Kotecha — travels, conferences, and moments beyond the lab.">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/main.css">
    <style>
        /* ---------- gallery-specific ---------- */
        .gallery-head { text-align: center; margin-bottom: 8px; }
        .gallery-head h1 { font-size: clamp(2rem, 4.5vw, 3rem); font-weight: 800; letter-spacing: -0.03em; margin: 0 0 8px; }
        .gallery-head p { color: var(--text-secondary); margin: 0 auto; max-width: 560px; }

        /* Globe */
        .globe-stage {
            position: relative;
            width: 100%;
            height: min(64vh, 620px);
            margin: 8px auto 4px;
            cursor: grab;
        }
        .globe-stage.dragging { cursor: grabbing; }
        .globe-stage canvas { display: block; width: 100%; height: 100%; }
        .globe-hint {
            position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
            font-size: 0.78rem; color: var(--text-secondary); opacity: 0.7; pointer-events: none;
            letter-spacing: 0.02em;
        }
        .globe-tooltip {
            position: fixed; z-index: 40; pointer-events: none;
            background: var(--card-solid); color: var(--text-main);
            border: 1px solid var(--border-strong); border-radius: 12px;
            padding: 9px 13px; font-size: 0.85rem; font-weight: 600;
            box-shadow: var(--shadow); opacity: 0; transform: translateY(4px);
            transition: opacity 0.15s ease, transform 0.15s ease; white-space: nowrap;
        }
        .globe-tooltip.show { opacity: 1; transform: translateY(0); }
        .globe-tooltip small { display: block; font-weight: 500; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }

        /* Trip cards (also work as accessible nav) */
        .trip-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 28px; }
        .trip-card {
            display: flex; flex-direction: column;
            text-align: left; cursor: pointer;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 18px; overflow: hidden;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .trip-card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: var(--shadow), var(--glow); }
        .trip-cover { position: relative; height: 150px; overflow: hidden; border-bottom: 1px solid var(--border); }
        .trip-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .trip-card:hover .trip-cover img { transform: scale(1.06); }
        .trip-count {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.55); color: #fff; backdrop-filter: blur(6px);
            font-size: 0.72rem; font-weight: 600; padding: 4px 9px; border-radius: 999px;
        }
        .trip-body { padding: 15px 17px 18px; }
        .trip-name { font-size: 1.12rem; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .trip-dates { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--accent); margin-bottom: 8px; }
        .trip-caption { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5; }

        /* Album view */
        .album-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 26px; }
        .album-head h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
        .album-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--accent); }
        .album-caption { color: var(--text-secondary); margin: 6px 0 0; max-width: 640px; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-main); text-decoration: none; font-size: 0.9rem; font-weight: 600;
            background: var(--card-glass); padding: 9px 16px; border-radius: 999px;
            border: 1px solid var(--border); cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .back-btn:hover { transform: translateX(-4px); border-color: var(--accent); color: var(--accent); }

        /* Masonry (preserves aspect ratios) */
        .masonry { column-count: 4; column-gap: 16px; }
        @media (max-width: 1100px) { .masonry { column-count: 3; } }
        @media (max-width: 760px)  { .masonry { column-count: 2; } }
        @media (max-width: 460px)  { .masonry { column-count: 1; } }
        .masonry .m-item {
            break-inside: avoid; margin-bottom: 16px; position: relative;
            border-radius: 14px; overflow: hidden; cursor: pointer;
            border: 1px solid var(--border); background: var(--card-solid);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .masonry .m-item:hover { transform: translateY(-4px); box-shadow: var(--shadow), var(--glow); border-color: var(--accent); }
        .masonry .m-item img, .masonry .m-item video { width: 100%; height: auto; display: block; }
        .video-badge {
            position: absolute; top: 10px; right: 10px; z-index: 2;
            background: rgba(0,0,0,0.6); color: #fff; padding: 4px 9px; border-radius: 8px;
            font-size: 0.72rem; display: flex; align-items: center; gap: 5px; backdrop-filter: blur(6px);
        }
        .play-icon { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid #fff; }

        /* Lightbox */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 2000; align-items: center; justify-content: center; }
        .lightbox.active { display: flex; }
        .lb-content { max-width: 92%; max-height: 82vh; }
        .lb-content img, .lb-content video { max-width: 100%; max-height: 82vh; border-radius: 10px; display: block; }
        .lb-close { position: absolute; top: 22px; right: 28px; font-size: 2.2rem; color: #fff; cursor: pointer; line-height: 1; transition: transform 0.2s ease; }
        .lb-close:hover { transform: scale(1.15); }
        .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 2.6rem; color: #fff; cursor: pointer; padding: 18px; user-select: none; transition: transform 0.2s ease; }
        .lb-nav:hover { transform: translateY(-50%) scale(1.15); }
        .lb-prev { left: 8px; } .lb-next { right: 8px; }
        .lb-counter { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; opacity: 0.85; }
        @media (max-width: 640px) { .lb-nav { font-size: 2rem; padding: 10px; } }

        .hidden { display: none !important; }
    </style>
</head>
<body data-page="gallery">

    <nav id="site-nav"></nav>

    <main class="container">
        <!-- GLOBE / OVERVIEW -->
        <section id="overview">
            <div class="gallery-head">
                <h1>Around the World</h1>
                <p>Conferences, travels, and moments beyond the lab. Spin the globe or pick a trip below.</p>
            </div>
            <div class="globe-stage" id="globe-stage">
                <div class="globe-hint">Drag to rotate · hover a trip below · click a marker</div>
            </div>
            <div class="trip-cards" id="trip-cards"></div>
        </section>

        <!-- ALBUM -->
        <section id="album" class="hidden">
            <div style="margin-bottom:22px;"><span class="back-btn" id="back-btn">&larr; Back to the globe</span></div>
            <div class="album-head">
                <div>
                    <h2 id="album-title"></h2>
                    <div class="album-sub" id="album-sub"></div>
                    <p class="album-caption" id="album-caption"></p>
                </div>
            </div>
            <div class="masonry" id="masonry"></div>
        </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lb-close" id="lb-close">&times;</span>
        <span class="lb-nav lb-prev" id="lb-prev">&#10094;</span>
        <span class="lb-nav lb-next" id="lb-next">&#10095;</span>
        <div class="lb-content" id="lb-content"></div>
        <div class="lb-counter" id="lb-counter"></div>
    </div>

    <div class="globe-tooltip" id="globe-tooltip"></div>

    <!-- shared chrome (nav / theme / footer) -->
    <script src="assets/content.js"></script>
    <script src="assets/render.js"></script>
    <!-- globe libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

    <script>
    /* =====================================================================
       GALLERY DATA — add a trip here and it appears on the globe + cards.
       coord is [longitude, latitude].
       ===================================================================== */
    const TRIPS = [
      {
        name: "Italy", flag: "🇮🇹", path: "Gallery/Italy/",
        coord: [16.87, 41.12], dates: "Aug–Sep 2024",
        caption: "Bari, Naples, and Capri Island.",
        cover: "Gallery/Italy/IMG-20240830-WA0022.jpg",
        items: [
          "IMG-20240830-WA0022.jpg","IMG20240901110258.jpg","IMG20240828154111-EFFECTS.jpg",
          "IMG20240901123721.jpg","IMG20240901101024.jpg","IMG20240831150236.jpg",
          "IMG20240828154300.jpg","IMG20240828215708.jpg","IMG20240830180916.jpg",
          "IMG20240828080341.jpg","IMG20240831150016.jpg","IMG20240829184145.jpg",
          "IMG20240830205653.jpg","IMG20240829160538.jpg","Snapchat-1308727522.jpg",
          "IMG-20240829-WA0010.jpg","VID-20240830-WA0032~2.mp4"
        ]
      },
      {
        name: "Jodhpur", flag: "🕌", path: "Gallery/Jodhpur/",
        coord: [73.0, 26.3], dates: "Jul 2025",
        caption: "The Blue City — forts, colour, and desert light.",
        cover: "Gallery/Jodhpur/IMG_20250702_125958.jpg",
        items: [
          "WhatsApp Image 2025-07-05 at 13.57.36.jpeg","IMG_20250703_164924.jpg",
          "IMG_20250702_155415.jpg","IMG_20250702_154503246.jpg","IMG_20250702_125958.jpg",
          "IMG_20250705_193803410.jpg","IMG_20250702_165909892.jpg","IMG_20250702_160129662.jpg",
          "IMG-20250703-WA0007.jpg","IMG20250705174219.jpg"
        ]
      },
      {
        name: "Seoul, Korea", flag: "🇰🇷", path: "Gallery/Seoul, Korea/",
        coord: [127.0, 37.6], dates: "Sep–Oct 2025",
        caption: "Humanoids 2025 and exploring Seoul.",
        cover: "Gallery/Seoul, Korea/20250929_203652.jpg",
        items: [
          "20250929_203652.jpg","20250930_133130.jpg","IMG-20250930-WA0024.jpg",
          "IMG-20251001-WA0045.jpg","IMG-20251002-WA0022.jpg","IMG20250928153752.jpg",
          "IMG20250929221701.jpg","IMG20250930131433.jpg","IMG20250930133508.jpg",
          "IMG20250930163315.jpg","IMG20251002150904.jpg","IMG20251004113937.jpg",
          "IMG20251004121645.jpg","VID20251004144844.mp4",
          "WhatsApp Video 2026-03-17 at 19.29.12.mp4","WhatsApp Video 2026-03-17 at 19.29.18.mp4",
          "WhatsApp Video 2026-03-17 at 19.29.25.mp4","WhatsApp Video 2026-03-17 at 19.29.46.mp4",
          "WhatsApp Video 2026-03-17 at 19.29.47 (1).mp4","WhatsApp Video 2026-03-17 at 19.29.47 (2).mp4",
          "WhatsApp Video 2026-03-17 at 19.29.47.mp4","WhatsApp Video 2026-03-17 at 19.29.48 (1).mp4",
          "WhatsApp Video 2026-03-17 at 19.29.48 (2).mp4","WhatsApp Video 2026-03-17 at 19.29.48.mp4",
          "WhatsApp Video 2026-03-17 at 19.29.49.mp4"
        ]
      },
      {
        name: "Shenyang, China", flag: "🇨🇳", path: "Gallery/Shenyang, China/",
        coord: [123.43, 41.80], dates: "Aug 16–21, 2026",
        caption: "Exploring Shenyang, China.",
        cover: "Gallery/Shenyang, China/IMG20260821140150.jpg",
        items: [
          "IMG20260821140150.jpg","IMG20260820152655.jpg","IMG20260820092049.jpg",
          "IMG20260816131110.jpg","IMG20260820152732.jpg","IMG_7657-opq4948546636.jpg",
          "VID20260817135758.mp4","IMG20260817092806.jpg","IMG20260821140141.jpg",
          "IMG20260817070010.jpg","IMG_7674-opq4948529571.jpg","VID20260821135337.mp4",
          "IMG20260821140101.jpg","IMG20260821140115.jpg","IMG20260821183607.jpg",
          "IMG20260817084954.jpg","IMG20260818084423.jpg","IMG20260818085259.jpg",
          "IMG_3296-opq4943572085.jpg","IMG20260821220830.jpg","IMG20260818084636.jpg",
          "ZHOU9333-opq4943094909.jpg"
        ]
      }
    ];
    const isVideo = (f) => /\.(mp4|mov|webm)$/i.test(f);

    /* ---------- TRIP CARDS (always rendered; also the fallback nav) ---------- */
    function renderTripCards() {
      document.getElementById('trip-cards').innerHTML = TRIPS.map((t, i) => `
        <div class="trip-card" data-trip="${i}" onclick="openAlbum(${i})">
          <div class="trip-cover">
            <img src="${t.cover}" alt="${t.name}" loading="lazy">
            <span class="trip-count">${t.items.length} items</span>
          </div>
          <div class="trip-body">
            <div class="trip-name">${t.flag} ${t.name}</div>
            <div class="trip-dates">${t.dates}</div>
            <div class="trip-caption">${t.caption}</div>
          </div>
        </div>`).join('');
    }

    /* ---------- ALBUM + MASONRY ---------- */
    let currentTrip = 0, currentItems = [], currentIndex = 0;
    function openAlbum(i) {
      const t = TRIPS[i]; currentTrip = i; currentItems = t.items;
      document.getElementById('album-title').innerHTML = `${t.flag} ${t.name}`;
      document.getElementById('album-sub').textContent = `${t.dates} · ${t.items.length} items`;
      document.getElementById('album-caption').textContent = t.caption;
      document.getElementById('masonry').innerHTML = t.items.map((f, idx) => {
        const src = t.path + f;
        return isVideo(f)
          ? `<div class="m-item" onclick="openLightbox(${idx})"><span class="video-badge"><span class="play-icon"></span>Video</span><video src="${encodeURI(src)}" muted autoplay loop playsinline></video></div>`
          : `<div class="m-item" onclick="openLightbox(${idx})"><img src="${encodeURI(src)}" alt="${t.name}" loading="lazy"></div>`;
      }).join('');
      document.getElementById('overview').classList.add('hidden');
      document.getElementById('album').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function showOverview() {
      document.getElementById('album').classList.add('hidden');
      document.getElementById('overview').classList.remove('hidden');
    }

    /* ---------- LIGHTBOX ---------- */
    function lbRender() {
      const t = TRIPS[currentTrip], f = currentItems[currentIndex], src = encodeURI(t.path + f);
      document.getElementById('lb-content').innerHTML = isVideo(f)
        ? `<video src="${src}" controls autoplay loop muted playsinline></video>`
        : `<img src="${src}" alt="${t.name}">`;
      document.getElementById('lb-counter').textContent = `${currentIndex + 1} / ${currentItems.length}`;
    }
    function openLightbox(i) { currentIndex = i; lbRender(); document.getElementById('lightbox').classList.add('active'); }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); document.getElementById('lb-content').innerHTML = ''; }
    function lbNav(d) { currentIndex = (currentIndex + d + currentItems.length) % currentItems.length; lbRender(); }

    document.addEventListener('DOMContentLoaded', () => {
      renderTripCards();
      document.getElementById('back-btn').addEventListener('click', showOverview);
      document.getElementById('lb-close').addEventListener('click', closeLightbox);
      document.getElementById('lb-prev').addEventListener('click', () => lbNav(-1));
      document.getElementById('lb-next').addEventListener('click', () => lbNav(1));
      document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
      document.addEventListener('keydown', (e) => {
        if (!document.getElementById('lightbox').classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') lbNav(-1);
        if (e.key === 'ArrowRight') lbNav(1);
      });
      // swipe on lightbox
      let sx = 0;
      const lb = document.getElementById('lightbox');
      lb.addEventListener('touchstart', (e) => { sx = e.changedTouches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - sx;
        if (Math.abs(dx) > 50) lbNav(dx < 0 ? 1 : -1);
      }, { passive: true });

      initGlobe();
    });

    /* =====================================================================
       3D GLOBE (three.js). Falls back silently to the trip cards if
       WebGL or the geometry data is unavailable.
       ===================================================================== */
    function initGlobe() {
      const stage = document.getElementById('globe-stage');
      if (!window.THREE || !stage) return;
      let renderer;
      try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
      catch (e) { return; } // no WebGL → cards remain

      const R = 1;
      const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      const themeCols = () => ({
        land: new THREE.Color(cssVar('--accent') || '#7d9bff'),
        sphere: new THREE.Color(document.documentElement.getAttribute('data-theme') === 'light' ? '#dfe6f5' : '#0e1424'),
        marker: new THREE.Color(cssVar('--accent-secondary') || '#ff7eb6'),
        arc: new THREE.Color(cssVar('--accent') || '#7d9bff')
      });

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, stage.clientWidth / stage.clientHeight, 0.1, 100);
      camera.position.set(0, 0, 3.1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(stage.clientWidth, stage.clientHeight);
      stage.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x99aaff, 0.7));
      const dir = new THREE.DirectionalLight(0xffffff, 0.85); dir.position.set(5, 3, 5); scene.add(dir);

      const globe = new THREE.Group(); scene.add(globe);
      let cols = themeCols();

      // base sphere
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(R, 64, 64),
        new THREE.MeshPhongMaterial({ color: cols.sphere, shininess: 6, transparent: true, opacity: 0.96 })
      );
      globe.add(sphere);

      // atmosphere
      const atmo = new THREE.Mesh(
        new THREE.SphereGeometry(R * 1.16, 48, 48),
        new THREE.MeshBasicMaterial({ color: cols.land, transparent: true, opacity: 0.10, side: THREE.BackSide, blending: THREE.AdditiveBlending })
      );
      scene.add(atmo);

      // lon/lat (degrees) -> vec3
      function ll(lon, lat, r) {
        const phi = (90 - lat) * Math.PI / 180, th = (lon + 180) * Math.PI / 180;
        return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
      }

      // markers
      const markers = [];
      TRIPS.forEach((t, i) => {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(0.028, 16, 16),
          new THREE.MeshBasicMaterial({ color: cols.marker })
        );
        m.position.copy(ll(t.coord[0], t.coord[1], R * 1.02));
        m.userData.trip = i; globe.add(m); markers.push(m);
        // halo ring
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.03, 0.055, 24),
          new THREE.MeshBasicMaterial({ color: cols.marker, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
        );
        ring.position.copy(m.position); ring.lookAt(0, 0, 0); m.userData.ring = ring; globe.add(ring);
      });

      let landLines = null, arcs = [], travellers = [];
      function buildArcs() {
        // connect trips in date order (array order)
        for (let i = 0; i < TRIPS.length - 1; i++) {
          const a = ll(TRIPS[i].coord[0], TRIPS[i].coord[1], R), b = ll(TRIPS[i + 1].coord[0], TRIPS[i + 1].coord[1], R);
          const mid = a.clone().add(b).multiplyScalar(0.5).normalize().multiplyScalar(R * (1 + 0.22 + a.distanceTo(b) * 0.12));
          const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
          const pts = curve.getPoints(60);
          const line = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pts),
            new THREE.LineBasicMaterial({ color: cols.arc, transparent: true, opacity: 0.55 })
          );
          globe.add(line); arcs.push(line);
          const dot = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 8), new THREE.MeshBasicMaterial({ color: cols.arc }));
          globe.add(dot); travellers.push({ dot, curve, t: Math.random() });
        }
      }

      // country outlines from world-atlas (same data source as before)
      fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
        .then(r => r.json())
        .then(world => {
          if (!window.topojson) return;
          const feats = topojson.feature(world, world.objects.countries).features;
          const pos = [];
          feats.forEach(f => {
            const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
            polys.forEach(poly => poly.forEach(ring => {
              for (let i = 0; i < ring.length - 1; i++) {
                const p1 = ll(ring[i][0], ring[i][1], R * 1.002), p2 = ll(ring[i + 1][0], ring[i + 1][1], R * 1.002);
                pos.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
              }
            }));
          });
          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
          landLines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: cols.land, transparent: true, opacity: 0.75 }));
          globe.add(landLines);
        })
        .catch(() => {})
        .finally(buildArcs);

      // theme reactivity
      new MutationObserver(() => {
        cols = themeCols();
        sphere.material.color.copy(cols.sphere);
        atmo.material.color.copy(cols.land);
        if (landLines) landLines.material.color.copy(cols.land);
        arcs.forEach(a => a.material.color.copy(cols.arc));
        travellers.forEach(tr => tr.dot.material.color.copy(cols.arc));
        markers.forEach(m => { m.material.color.copy(cols.marker); m.userData.ring.material.color.copy(cols.marker); });
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

      // orientation helper: quaternion that brings (lon,lat) to face the camera, north up
      const Zc = new THREE.Vector3(0, 0, 1);
      function orientationFor(lon, lat) {
        const target = ll(lon, lat, 1).normalize();
        const q1 = new THREE.Quaternion().setFromUnitVectors(target, Zc);
        const up1 = new THREE.Vector3(0, 1, 0).applyQuaternion(q1);
        const qRoll = new THREE.Quaternion().setFromAxisAngle(Zc, -Math.atan2(up1.x, up1.y));
        return qRoll.multiply(q1);
      }
      // park the globe upright, facing the pins (yaw only -> axis stays vertical)
      globe.quaternion.copy(orientationFor(72, 0));
      let targetQuat = null;

      // hover a trip card -> glide (yaw) to that pin, keeping the globe straight
      document.querySelectorAll('.trip-card').forEach(card => {
        card.addEventListener('mouseenter', () => {
          const t = TRIPS[+card.dataset.trip];
          targetQuat = orientationFor(t.coord[0], 0);
        });
      });

      // drag to rotate about world axes; no inertia, no auto-rotate
      const wY = new THREE.Vector3(0, 1, 0), wX = new THREE.Vector3(1, 0, 0);
      let dragging = false, moved = false, px = 0, py = 0;
      const onDown = (x, y) => { dragging = true; moved = false; px = x; py = y; targetQuat = null; stage.classList.add('dragging'); };
      const onMove = (x, y) => {
        if (!dragging) return;
        const dx = x - px, dy = y - py; px = x; py = y;
        if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
        const qy = new THREE.Quaternion().setFromAxisAngle(wY, dx * 0.006);
        const qx = new THREE.Quaternion().setFromAxisAngle(wX, dy * 0.006);
        globe.quaternion.premultiply(qy).premultiply(qx);
      };
      const onUp = (x, y) => {
        stage.classList.remove('dragging');
        if (dragging && !moved) pick(x, y); // treat as click
        dragging = false;
      };
      stage.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
      window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', e => onUp(e.clientX, e.clientY));
      stage.addEventListener('touchstart', e => onDown(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      stage.addEventListener('touchmove', e => onMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      stage.addEventListener('touchend', e => { const t = e.changedTouches[0]; onUp(t.clientX, t.clientY, true); }, { passive: true });

      // hover + click picking
      const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
      const tip = document.getElementById('globe-tooltip');
      function hit(cx, cy) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((cx - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((cy - rect.top) / rect.height) * 2 + 1;
        ray.setFromCamera(mouse, camera);
        return ray.intersectObjects(markers)[0];
      }
      function pick(cx, cy) { const h = hit(cx, cy); if (h) openAlbum(h.object.userData.trip); }
      stage.addEventListener('mousemove', e => {
        if (dragging) { tip.classList.remove('show'); return; }
        const h = hit(e.clientX, e.clientY);
        if (h) {
          const t = TRIPS[h.object.userData.trip];
          tip.innerHTML = `${t.flag} ${t.name}<small>${t.dates}</small>`;
          tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
          tip.classList.add('show'); stage.style.cursor = 'pointer';
        } else { tip.classList.remove('show'); stage.style.cursor = ''; }
      });
      stage.addEventListener('mouseleave', () => tip.classList.remove('show'));

      // resize
      function resize() {
        const w = stage.clientWidth, h = stage.clientHeight;
        camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
      }
      window.addEventListener('resize', resize);

      // animate
      let clock = 0;
      (function loop() {
        requestAnimationFrame(loop);
        clock += 0.016;
        if (targetQuat && !dragging) {
          globe.quaternion.slerp(targetQuat, 0.09);
          if (globe.quaternion.angleTo(targetQuat) < 0.002) targetQuat = null;
        }
        const s = 1 + Math.sin(clock * 2.2) * 0.18;
        markers.forEach(m => { m.userData.ring.scale.setScalar(s); m.userData.ring.material.opacity = 0.5 * (1.4 - s); });
        travellers.forEach(tr => { tr.t = (tr.t + 0.004) % 1; tr.dot.position.copy(tr.curve.getPoint(tr.t)); });
        renderer.render(scene, camera);
      })();
    }
    </script>
</body>
</html>
